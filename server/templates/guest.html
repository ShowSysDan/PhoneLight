<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>glow.lighting</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;background:#000;display:grid}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:24px;color:#fff;font:16px/1.4 system-ui,-apple-system,sans-serif;text-align:center;background:#000}
/* wordmark: white core, layered RGB halo; the whole halo cycles hue (one compositor-friendly filter, no JS) */
#go:before{content:'';position:absolute;left:50%;top:38%;width:140vw;height:60vh;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,43,214,.28),rgba(122,92,255,.14) 45%,transparent 75%);
  animation:hue 6s linear infinite;pointer-events:none}
#w{position:relative;margin:0 0 6px;font:800 clamp(40px,13vw,76px)/1.05 system-ui,-apple-system,'Segoe UI',sans-serif;
  letter-spacing:-.02em;color:#fff;white-space:nowrap;
  text-shadow:0 0 3px #fff,0 0 10px #ff2bd6,0 0 22px #ff2bd6,0 0 40px #7a5cff,0 0 70px #00e5ff,0 0 110px #00e5ff;
  animation:hue 6s linear infinite,breathe 3s ease-in-out infinite alternate}
#w i{font-style:normal;font-weight:300}
#go div,#go small{position:relative}
#go button{position:relative;font:inherit;font-size:20px;font-weight:600;color:#000;background:#fff;border:0;border-radius:40px;
  padding:16px 40px;box-shadow:0 0 18px #ff2bd6,0 0 42px #7a5cff;animation:hue 6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes breathe{from{opacity:.86}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ #go:before,#w,#go button{animation:none} }
#go small{max-width:340px;color:#999;font-size:12px}
#i{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.78);
  color:#fff;font:12px/1.6 ui-monospace,Menlo,monospace;white-space:pre;text-align:left;pointer-events:none}
#n{position:fixed;right:6px;bottom:calc(4px + env(safe-area-inset-bottom));color:#fff;opacity:.6;font:10px ui-monospace,Menlo,monospace;pointer-events:none}
#s{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#fff;opacity:.35;font:11px system-ui,sans-serif;pointer-events:none}
</style>
</head><body>
<div id="c"></div>
<div id="go">
<h1 id="w">glow<i>.lighting</i></h1>
<div>Turn your brightness up, then tap to join the light show.</div>
<button id="b">Tap to start</button>
<small>To run the show this page logs basic technical details about your device (IP address, browser,
screen size, language, time zone) and how long you are connected. Nothing personal is asked for or stored.</small>
</div>
<div id="s"></div>
<div id="n"></div>
<div id="i" hidden></div>
<script>
(function(){
var c=document.getElementById('c'),go=document.getElementById('go'),st=document.getElementById('s');
var ls={};try{ls=window.localStorage||{}}catch(e){}
function get(k){try{return ls.getItem?ls.getItem(k):null}catch(e){return null}}
function put(k,v){try{ls.setItem&&ls.setItem(k,v)}catch(e){}}
var m=document.cookie.match(/(?:^|; )pl_id=([\w-]+)/);
var id=get('pl_id')||(m&&m[1]);
if(!id){id='';var a='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<24;i++)id+=a[Math.random()*36|0]}
put('pl_id',id);var nid=document.getElementById('n');nid.textContent=id;document.cookie='pl_id='+id+';max-age=31536000;path=/;samesite=lax';
var ws,tries=0,blackT,lockS,last=0,syncT,nsync=0;
// Sync: frames carry "show at server ms" (uint32). off = server clock - our clock, from
// NTP-style samples; keep the lowest-round-trip of the last 8. q = frames waiting for their time.
var off=null,samples=[],q=[],now=function(){return performance.now()};
// Cells: the screen is a grid of ncell cells, per side by side (the 'l' message), cell 1 top left.
var cells=[],shown=[],ncell=0,per=0,want=0;
function layout(n,k){
  if(n==ncell&&k==want)return;ncell=n;want=k;per=Math.max(1,Math.min(k,n));c.innerHTML='';cells=[];shown=[];
  c.style.gridTemplateColumns='repeat('+per+',1fr)';c.style.gridTemplateRows='repeat('+Math.ceil(n/per)+',1fr)';
  for(var i=0;i<n;i++){var e=document.createElement('div');e.style.background='#000';c.appendChild(e);cells.push(e);shown.push('#000')}
}
layout(1,1);
function paint(cs){for(var i=0;i<cs.length&&i<ncell;i++)if(cs[i]!==shown[i]){shown[i]=cs[i];cells[i].style.background=cs[i]}}
function black(){q=[];var cs=[];for(var i=0;i<ncell;i++)cs.push('#000');paint(cs)}
function sync(){if(ws&&ws.readyState==1)ws.send('s'+now().toFixed(1));syncT=setTimeout(sync,++nsync<6?150:4000)}
function synced(d){
  var p=d.slice(1).split(','),c0=+p[0],t1=+p[1],t2=+p[2],c3=now();
  samples.push([(c3-c0)-(t2-t1),((t1-c0)+(t2-c3))/2]);if(samples.length>8)samples.shift();
  var b=samples[0];for(var i=1;i<samples.length;i++)if(samples[i][0]<b[0])b=samples[i];off=b[1];
}
var nframes=0,fx='';
function frame(b){
  nframes++;
  var n=(b.length-4)/3|0,col=[],j=n*3;if(n<1)return;
  if(n!=ncell)layout(n,want||1);
  for(var i=0;i<j;i+=3)col.push('rgb('+b[i]+','+b[i+1]+','+b[i+2]+')');
  if(off===null){q=[];return paint(col)}
  var at=((b[j]<<24|b[j+1]<<16|b[j+2]<<8|b[j+3])>>>0),wait=(at-(Math.round(now()+off)>>>0))|0;
  if(wait<=0||wait>2000){q=[];return paint(col)}   // late (or nonsense): show now, it is the newest
  q.push([now()+wait,col]);if(q.length>64)q.shift();
}
function tick(){var t=now(),col=null;while(q.length&&q[0][0]<=t)col=q.shift()[1];if(col)paint(col);requestAnimationFrame(tick)}
function hello(){
  var n=navigator,cn=n.connection||{},f=parseInt(get('pl_fx'),10);
  return JSON.stringify({id:id,fixture:f>0?f:undefined,sw:screen.width,sh:screen.height,dpr:window.devicePixelRatio||1,
    lang:n.language,tz:(window.Intl&&Intl.DateTimeFormat().resolvedOptions().timeZone)||'',touch:n.maxTouchPoints||0,
    cores:n.hardwareConcurrency||0,mem:n.deviceMemory||0,conn:cn.effectiveType||'',plat:n.platform||'',
    standalone:!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||!!n.standalone});
}
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.binaryType='arraybuffer';
  ws.onopen=function(){tries=0;last=Date.now();clearTimeout(blackT);st.textContent='';ws.send(hello());
    samples=[];off=null;nsync=0;clearTimeout(syncT);sync()};
  ws.onmessage=function(e){
    var d=e.data;last=Date.now();
    if(typeof d!='string')return frame(new Uint8Array(d));
    if(d[0]=='p')ws.send(d);else if(d[0]=='s')synced(d);else if(d[0]=='f'){fx=d.slice(1);put('pl_fx',fx)}
    else if(d[0]=='l'){var p=d.slice(1).split(',');if(+p[0]>0)layout(+p[0],+p[1]||1)}
  };
  ws.onclose=function(){
    ws=null;clearTimeout(syncT);clearTimeout(blackT);blackT=setTimeout(black,3000);st.textContent='reconnecting…';
    // back off with jitter so a server restart is not hit by every phone at once
    setTimeout(connect,Math.min(5000,500*++tries)+Math.random()*2000);
  };
}
// Keep the screen on: the Wake Lock API (HTTPS only), else a tiny muted looping video (works over HTTP).
var vid;
function video(){
  if(!vid){vid=document.createElement('video');vid.muted=true;vid.loop=true;vid.setAttribute('playsinline','');
    vid.setAttribute('muted','');vid.style.cssText='position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none';
    vid.src='/static/keepawake.mp4';document.body.appendChild(vid)}
  var p=vid.play();p&&p.catch&&p.catch(function(){});
}
function lock(){
  if(document.visibilityState!='visible')return;
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){lockS=l}).catch(video);else video();
}
// Long-press anywhere (0.7 s): a status readout for crew, hidden again after 6 s.
var info=document.getElementById('i'),pressT,infoT,hideT,fr0=0;
function status(){
  var b=null;for(var k=0;k<samples.length;k++)if(!b||samples[k][0]<b[0])b=samples[k];
  var up=ws&&ws.readyState==1,fps=nframes-fr0;fr0=nframes;
  info.textContent='glow.lighting\nfixture '+(fx||'?')+' \u00b7 '+(up?'connected':'reconnecting')+
    '\nround trip '+(b?Math.round(b[0])+' ms':'\u2013')+' \u00b7 sync '+(off===null?'not yet':'\u00b1'+Math.max(1,Math.round(b[0]/2))+' ms')+
    '\n'+fps*2+' frames/s \u00b7 '+shown[0]+(ncell>1?' (cell 1 of '+ncell+')':'')+'\nid '+id.slice(0,8);
}
function showInfo(){
  clearInterval(infoT);clearTimeout(hideT);fr0=nframes;status();info.hidden=false;infoT=setInterval(status,500);
  hideT=setTimeout(function(){info.hidden=true;clearInterval(infoT)},6000);
}
c.addEventListener('pointerdown',function(){clearTimeout(pressT);pressT=setTimeout(showInfo,700)});
['pointerup','pointercancel','pointerleave'].forEach(function(t){c.addEventListener(t,function(){clearTimeout(pressT)})});
c.addEventListener('contextmenu',function(e){e.preventDefault()});
document.getElementById('b').onclick=function(){
  var d=document.documentElement,r=d.requestFullscreen||d.webkitRequestFullscreen;
  if(r)try{var p=r.call(d);p&&p.catch&&p.catch(function(){})}catch(e){}
  go.style.display='none';nid.style.color='#000';lock();connect();requestAnimationFrame(tick);
};
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState=='visible')lock();
});
// the server pings every 5 s: silence for 12 s means a dead socket (phone slept, Wi-Fi roamed)
setInterval(function(){if(ws&&ws.readyState==1&&Date.now()-last>12000)ws.close()},3000);
})();
</script>
</body></html>
