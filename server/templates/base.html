<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Glow.lighting admin{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/phonelight.css') }}?v={{ version }}">
</head>
<body data-page="{{ page }}">
  <header class="header">
    <div class="header-left">
      <a href="{{ url_for('admin_live') }}"><span class="logo">Glow<span>.lighting</span></span></a>
      <span class="version">v{{ version }}</span>
      <span id="pill-sacn" class="pill"><i></i><span>sACN …</span></span>
      <span id="pill-guests" class="pill info"><i></i><span>– phones</span></span>
      <span id="pill-mode" class="pill" hidden><i></i><span></span></span>
    </div>
    <span id="pill-feed" class="pill"><i></i><span>connecting</span></span>
  </header>
  <nav class="nav">
    <a href="{{ url_for('admin_live') }}" class="{{ 'active' if page == 'live' }}">Live</a>
    <a href="{{ url_for('admin_sacn') }}" class="{{ 'active' if page == 'sacn' }}">sACN monitor</a>
    <a href="{{ url_for('admin_clients') }}" class="{{ 'active' if page == 'clients' }}">Clients</a>
    <a href="{{ url_for('admin_settings') }}" class="{{ 'active' if page == 'settings' }}">Settings</a>
  </nav>
  <main class="main">{% block main %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/common.js') }}?v={{ version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
